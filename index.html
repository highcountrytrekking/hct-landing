<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | High Country Trekking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(rgba(15, 23, 42, 0.65), rgba(15, 23, 42, 0.75)), 
                        url('DSC08963.webp') no-repeat center center fixed;
            background-size: cover;
            color: #f8fafc;
            padding: 1.5rem;
            text-align: center;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 3rem 2rem;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .badge {
            display: inline-block;
            padding: 0.35rem 1rem;
            background-color: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1rem;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        p {
            font-size: 1.125rem;
            color: #e2e8f0;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
            background: rgba(15, 23, 42, 0.5);
            padding: 1.5rem;
            border-radius: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .contact-item {
            font-size: 1.1rem;
            color: #cbd5e1;
        }

        .contact-item strong {
            color: #ffffff;
        }

        .contact-item a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .contact-item a:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="badge">Under Construction</span>
        <h1>We are launching soon</h1>
        <p>Our website is currently under development. We are working hard to bring you an extraordinary trekking experience. Get in touch with us directly below.</p>
        
        <div class="contact-info">
            <div class="contact-item">
                <strong>Email:</strong> 
                <a href="mailto:info@highcountrytrekking.com">info@highcountrytrekking.com</a>
            </div>
            <div class="contact-item">
                <strong>Call or WhatsApp:</strong> 
                <a href="https://wa.me/9779851408774" target="_blank" rel="noopener">+977 9851408774</a>
            </div>
        </div>
    </div>

</body>
</html>
